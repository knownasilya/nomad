# Builds the Android app on pull requests that touch mobile/, so a native change (like the
# auto-updater in mobile/modules/nomad-updater) is known to compile before it reaches a release.
# The release build itself is the build-android job in release.yml.
name: Mobile Android

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Android (debug)
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: volta-cli/action@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p .

      - name: Bundle Bare backend
        run: npm run bundle

      - name: Generate android project
        run: npx expo prebuild --platform android --no-install

      # One ABI is enough to know the native code compiles, and much faster than four.
      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
