name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: volta-cli/action@v5

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3-dev \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2-dev

      - name: Install node-gyp globally
        run: npm install -g node-gyp

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Checking main bundle ==="
          if grep -q 'protocol.handle("nomad"' app/main.build.js; then
            echo "✓ protocol.handle found in main.build.js"
          else
            echo "✗ protocol.handle MISSING — build may be stale or failed"
            exit 1
          fi
          echo "=== Checking preload ==="
          test -f app/fg/webview-preload/index.build.js && echo "✓ preload bundle exists" || (echo "✗ preload bundle MISSING" && exit 1)

      # A self-signed certificate (no Apple account) gives every build the same code signature, which
      # is what Squirrel.Mac checks before it installs an update. Ad-hoc builds can never update.
      # Make it with scripts/make-mac-signing-cert.sh; see docs/releasing.md.
      - name: Import macOS self-signed certificate
        if: runner.os == 'macOS'
        env:
          NOMAD_MAC_CERT: ${{ secrets.NOMAD_MAC_CERT }}
          NOMAD_MAC_CERT_PASSWORD: ${{ secrets.NOMAD_MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$NOMAD_MAC_CERT" ]; then
            echo "::warning::NOMAD_MAC_CERT is not set: the macOS build is ad-hoc signed and cannot auto-update"
            exit 0
          fi
          KC="$RUNNER_TEMP/nomad-signing.keychain-db"
          KCPW="$(openssl rand -hex 16)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$NOMAD_MAC_CERT" | base64 --decode > "$RUNNER_TEMP/nomad.p12"
          security import "$RUNNER_TEMP/nomad.p12" -k "$KC" -P "$NOMAD_MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/nomad.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "Nomad Self-Signed" -p "$KC" > "$RUNNER_TEMP/nomad.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/nomad.pem"
          security find-identity -v -p codesigning "$KC"
          echo "NOMAD_MAC_SIGN_IDENTITY=Nomad Self-Signed" >> "$GITHUB_ENV"

      - name: Package and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass secrets as neutral names; the run script wires them conditionally
          # to avoid setting CSC_LINK='' which electron-builder resolves to CWD.
          _MAC_CERTS: ${{ secrets.MAC_CERTS }}
          _MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          _APPLE_ID: ${{ secrets.APPLE_ID }}
          _APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$_MAC_CERTS" ]; then
            export CSC_LINK="$_MAC_CERTS"
            export CSC_KEY_PASSWORD="$_MAC_CERTS_PASSWORD"
            export appleId="$_APPLE_ID"
            export appleIdPassword="$_APPLE_ID_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --publish always

      # A beta tag (v1.22.0-beta.0) makes a GitHub prerelease. electron-builder only makes drafts, so
      # flag the draft here; it stays a draft until it's published by hand. Apps with Beta releases on
      # update to a published prerelease; the rest only see GitHub's "latest", which skips them.
      - name: Mark a beta as a prerelease
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease

  build-android:
    runs-on: ubuntu-latest
    name: Build Android
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: volta-cli/action@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Bundle Bare backend
        run: npm run bundle

      # android/ is not committed (continuous native generation) — generate it,
      # letting the config plugins inject the Gradle pin + release signing.
      - name: Generate android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release AAB and APK
        env:
          # Pass secrets as neutral names and wire them conditionally (same
          # pattern as the macOS certs above) so an unset secret falls back to
          # the debug keystore instead of breaking the Gradle signing config.
          _ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          _ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          _ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          _ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$_ANDROID_KEYSTORE" ]; then
            echo "$_ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="$_ANDROID_KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS="$_ANDROID_KEY_ALIAS"
            export ANDROID_KEY_PASSWORD="$_ANDROID_KEY_PASSWORD"
            echo "Signing with release keystore"
          else
            echo "::warning::No ANDROID_KEYSTORE secret configured — signing with the debug keystore"
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            VERSION_CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          else
            VERSION_CODE=1
          fi
          export NOMAD_VERSION_NAME="$VERSION"
          export NOMAD_VERSION_CODE="$VERSION_CODE"
          echo "versionName=$VERSION versionCode=$VERSION_CODE"

          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # A beta tag (v1.22.0-beta.0) is a GitHub prerelease, like the desktop job marks it.
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          # The phone's auto-updater (mobile/lib/updateRelease.ts) installs the asset ending in
          # -android.apk from the latest published release (or prerelease, for Beta releases), so
          # keep this name.
          cp android/app/build/outputs/bundle/release/app-release.aab "nomad-$VERSION-android.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "nomad-$VERSION-android.apk"
          # electron-builder publishes the desktop artifacts to a draft release
          # for this tag; reuse it if it already exists, otherwise create it.
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft $PRERELEASE --title "$GITHUB_REF_NAME" \
            || true
          gh release upload "$GITHUB_REF_NAME" \
            "nomad-$VERSION-android.aab" \
            "nomad-$VERSION-android.apk" \
            --clobber
          if [ -n "$PRERELEASE" ]; then gh release edit "$GITHUB_REF_NAME" --prerelease; fi
